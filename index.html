<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Slide Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans selection:bg-indigo-500 selection:text-white overflow-x-hidden relative">

    <!-- Background Elements for Glassmorphism -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-purple-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-blob"></div>
        <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[40%] h-[40%] bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-blob animation-delay-4000"></div>
    </div>

    <div class="container mx-auto px-4 py-8 max-w-5xl relative z-10">
        <!-- Header -->
        <header class="text-center mb-10 space-y-2">
            <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                MCQ to Slides Converter
            </h1>
            <p class="text-gray-400 text-lg">Transform raw text into professional presentation slides instantly.</p>
        </header>

        <!-- Main Dashboard -->
        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Left Column: Input -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Input Card -->
                <div class="glass-panel p-6 rounded-2xl border border-white/10 shadow-2xl backdrop-blur-md bg-white/5">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold flex items-center gap-2">
                            <i data-lucide="file-text" class="w-5 h-5 text-blue-400"></i>
                            Input Questions
                        </h2>
                        <button id="clearBtn" class="text-xs text-gray-400 hover:text-white transition-colors flex items-center gap-1">
                            <i data-lucide="trash-2" class="w-3 h-3"></i> Clear
                        </button>
                    </div>

                    <textarea id="questionInput"
                        class="w-full h-[400px] bg-black/20 border border-white/10 rounded-xl p-4 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 resize-y font-mono text-sm leading-relaxed"
                        placeholder="Paste your questions here in the format:

1. [English Question]
[Hindi Question]
(a) Option 1 (b) Option 2
(c) Option 3 (d) Option 4
OR
1. Question
a. Option 1
b. Option 2
..."></textarea>
                </div>

                <!-- Action Bar -->
                <div class="flex justify-end">
                    <button id="generateBtn" class="group relative px-8 py-3 bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl font-semibold shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed overflow-hidden">
                        <span class="relative z-10 flex items-center gap-2">
                            <i data-lucide="zap" class="w-5 h-5 group-hover:text-yellow-300 transition-colors"></i>
                            Generate Slides
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-r from-purple-600 to-blue-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    </button>
                </div>
            </div>

            <!-- Right Column: Status & Preview -->
            <div class="space-y-6">
                <!-- Status Card -->
                <div class="glass-panel p-6 rounded-2xl border border-white/10 shadow-xl backdrop-blur-md bg-white/5 h-full flex flex-col">
                    <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                        <i data-lucide="activity" class="w-5 h-5 text-green-400"></i>
                        System Status
                    </h2>

                    <!-- Progress Bar -->
                    <div class="mb-6">
                        <div class="flex justify-between text-sm mb-2">
                            <span class="text-gray-400">Progress</span>
                            <span id="progressText" class="text-blue-400 font-mono">0%</span>
                        </div>
                        <div class="h-2 bg-gray-700/50 rounded-full overflow-hidden">
                            <div id="progressBar" class="h-full bg-gradient-to-r from-blue-500 to-purple-500 w-0 transition-all duration-300 relative">
                                <div class="absolute inset-0 bg-white/30 animate-pulse-fast"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Terminal Log -->
                    <div class="flex-1 flex flex-col min-h-[300px]">
                        <div class="bg-black/40 rounded-t-lg p-2 flex items-center gap-2 border-b border-white/5">
                            <div class="w-3 h-3 rounded-full bg-red-500"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                            <div class="w-3 h-3 rounded-full bg-green-500"></div>
                            <span class="ml-2 text-xs text-gray-500 font-mono">terminal</span>
                        </div>
                        <div id="logWindow" class="flex-1 bg-black/40 p-4 font-mono text-xs text-green-400 overflow-y-auto max-h-[300px] scrollbar-thin scrollbar-thumb-gray-700 scrollbar-track-transparent rounded-b-lg border border-white/5 border-t-0 space-y-1">
                            <div class="text-gray-500">system ready...</div>
                            <div class="text-gray-500">waiting for input...</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden Rendering Container -->
    <div id="renderContainer" class="fixed top-0 left-0 -z-50 pointer-events-none opacity-0 overflow-hidden" style="width: 1920px; height: 1080px;">
        <div id="slideTemplate" class="w-[1920px] h-[1080px] bg-white relative p-20 flex flex-row gap-16 text-slate-900 font-sans">

            <div class="absolute top-8 right-12 text-gray-200 font-bold text-4xl select-none pointer-events-none">
                MCQ SLIDES
            </div>

            <!-- Question Area (40% width) -->
            <div class="w-[40%] flex flex-col justify-between py-10">

                <div class="space-y-8">
                    <div class="inline-block bg-blue-100 px-8 py-3 rounded-2xl border border-blue-200 text-blue-700 font-mono text-3xl font-bold">
                        Question <span id="slideQNum">01</span>
                    </div>

                    <div class="space-y-6">
                        <h1 id="slideQuestionEn" class="text-4xl font-bold leading-tight text-slate-900">
                            <!-- English Question Here -->
                        </h1>
                        <h2 id="slideQuestionHi" class="text-3xl font-medium leading-relaxed text-slate-600 font-hindi border-l-4 border-blue-500 pl-6">
                            <!-- Hindi Question Here -->
                        </h2>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <!-- Option A -->
                    <div class="bg-slate-50 border-2 border-slate-100 rounded-3xl flex flex-col items-center justify-center p-6 shadow-sm">
                        <div class="w-14 h-14 rounded-full bg-blue-600 text-white flex items-center justify-center text-2xl font-bold mb-3">
                            A
                        </div>
                        <div id="slideOptA" class="text-2xl text-slate-800 font-semibold text-center"></div>
                    </div>

                    <!-- Option B -->
                    <div class="bg-slate-50 border-2 border-slate-100 rounded-3xl flex flex-col items-center justify-center p-6 shadow-sm">
                        <div class="w-14 h-14 rounded-full bg-purple-600 text-white flex items-center justify-center text-2xl font-bold mb-3">
                            B
                        </div>
                        <div id="slideOptB" class="text-2xl text-slate-800 font-semibold text-center"></div>
                    </div>

                    <!-- Option C -->
                    <div class="bg-slate-50 border-2 border-slate-100 rounded-3xl flex flex-col items-center justify-center p-6 shadow-sm">
                        <div class="w-14 h-14 rounded-full bg-emerald-600 text-white flex items-center justify-center text-2xl font-bold mb-3">
                            C
                        </div>
                        <div id="slideOptC" class="text-2xl text-slate-800 font-semibold text-center"></div>
                    </div>

                    <!-- Option D -->
                    <div class="bg-slate-50 border-2 border-slate-100 rounded-3xl flex flex-col items-center justify-center p-6 shadow-sm">
                        <div class="w-14 h-14 rounded-full bg-rose-600 text-white flex items-center justify-center text-2xl font-bold mb-3">
                            D
                        </div>
                        <div id="slideOptD" class="text-2xl text-slate-800 font-semibold text-center"></div>
                    </div>
                </div>
            </div>

            <!-- Solution Space (60% width) -->
            <div class="w-[60%] h-full border-l-2 border-dashed border-gray-100 flex flex-col justify-end items-center pb-10">
                <div class="text-gray-300 text-xl font-mono italic">
                    Solution Space
                </div>
            </div>

            <div class="absolute bottom-6 left-20 text-gray-400 text-lg font-mono">
                Created with MCQ Slide Generator
            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script src="script.js"></script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
</body>
</html>
